version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: lunarforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunarforge_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lunarforge_pgdata:/var/lib/postgresql/data

volumes:
  lunarforge_pgdata:
