# === Server ===
server.port=8080

# === Database (local PostgreSQL) ===
# Create the DB first: CREATE DATABASE lunarforge_market;
spring.datasource.url=jdbc:postgresql://localhost:5432/lunarforge_market
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# задано явно (было по умолчанию -> WARN при старте). часть кода читает связанные сущности (продавец, участники
# чата) вне транзакции - с false это может начать падать. выключать только вместе с доработкой сервисов
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
# hibernate при создании уникальных ограничений сначала делает "drop constraint if exists" - на новой базе postgres
# отвечает "ограничение ... не существует, пропускается", и это шло в лог как WARN. это не ошибки - не выводим.
# настоящие ошибки SQL (ERROR) по-прежнему видны
spring.jpa.properties.hibernate.jdbc.log.warnings=false

# === JWT ===
# 256-bit+ secret, change before any real deployment.
app.jwt.secret=change_this_super_secret_key_before_any_real_deployment_1234567890
app.jwt.expiration-ms=604800000

# === Misc ===
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Keep JSON dates as ISO-8601 strings ("2026-10-04T10:15:30Z") - the Android client parses them as text.
spring.jackson.serialization.write-dates-as-timestamps=false

# тестовые аккаунты test1..test3 (пароль 123456) создаются при старте, если их нет.
# ПЕРЕД НАСТОЯЩИМ ЗАПУСКОМ поставить false - иначе любой войдёт по известному паролю
lunar.seed-test-users=true
